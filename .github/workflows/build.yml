name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # The download is named with the version (Retag-1.8.apk); the installed app is still just "Retag".
      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "APK_NAME=Retag-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Retag-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Retag-apk
          path: ${{ env.APK_NAME }}

      - name: Publish as a release (easy download on your phone)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Retag ${{ env.VERSION }} (build ${{ github.run_number }})
          files: ${{ env.APK_NAME }}
          make_latest: true
