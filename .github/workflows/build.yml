name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # The download is named with the version (Retag-1.8.0.apk); the installed app is still just "Retag".
      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=Retag-$VERSION.apk" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Retag-$VERSION.apk"

      # The release description is this version's section of CHANGELOG.md ("## v1.8.0" up to the next "## ").
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## v$VERSION" '$0 == h { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## v$VERSION'. Add one describing what changed."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Retag-apk
          path: ${{ env.APK_NAME }}

      # Only a new version gets a release; pushing without bumping versionName just builds.
      - name: Check whether this version is already released
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "NEW_VERSION=false" >> "$GITHUB_ENV"
            echo "::notice::v$VERSION is already released. Bump versionName in app/build.gradle.kts to publish a new one."
          else
            echo "NEW_VERSION=true" >> "$GITHUB_ENV"
          fi

      - name: Publish as a release (easy download on your phone)
        if: github.ref == 'refs/heads/main' && env.NEW_VERSION == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Retag ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.APK_NAME }}
          make_latest: true
