name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSLO https://repo1.maven.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1.jar
          A=$(unzip -l jaudiotagger-3.0.1.jar | grep -i -o "org/jaudiotagger/audio/opus[^ ]*" | head -5 | tr '\n' ' ')
          unzip -o -q jaudiotagger-3.0.1.jar org/jaudiotagger/audio/SupportedFileFormat.class
          B=$(strings org/jaudiotagger/audio/SupportedFileFormat.class | grep -E "^[a-z0-9]{2,5}$" | tr '\n' ' ')
          echo "::notice::OPUS=[$A] FORMATS=[$B]"
